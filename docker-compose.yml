services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: productcatalog-postgres
    environment:
      POSTGRES_DB: productcatalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: productcatalog-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=productcatalog;Username=postgres;Password=postgres"
    depends_on:
      - postgres

volumes:
  postgres_data:
